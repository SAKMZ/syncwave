name: Feature request
description: Suggest something Syncwave should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not just the solution. It helps find the best fit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
